[project]
name = "jade-gateway-2d"
version = "0.1.0"
description = "Jade 2D Payment Gateway — high-performance international payment orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-fasthtml>=0.12.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "polars>=0.20.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
